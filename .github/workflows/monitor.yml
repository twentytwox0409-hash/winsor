name: monitor
on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    paths:
      - communities.json
  workflow_dispatch:
    inputs:
      test_email:
        description: "只发一封测试邮件"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      LOOP_SECONDS: "3200"
      INTERVAL_SECONDS: "90"
      GROWTH_N: "5"
      GROWTH_WINDOW: "120"
      GROWTH_COOLDOWN: "600"
    steps:
      - uses: actions/checkout@v4
      - name: 发测试邮件
        if: ${{ inputs.test_email }}
        run: python3 monitor.py --test
      - name: 检查社区
        if: ${{ !inputs.test_email }}
        run: python3 monitor.py
      - name: 保存状态
        if: ${{ always() && !inputs.test_email }}
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "update state" && (git push || (git pull --rebase --autostash && git push)))
      - name: 接力下一轮
        if: ${{ (success() || failure()) && !inputs.test_email }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref main
