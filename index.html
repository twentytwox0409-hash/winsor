<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f4ebf1">
<title>社区开门监控</title>
<style>
:root{color-scheme:light;--font:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;--bg:#f4ebf1;--bg2:#e7e5f1;--card:#fff;--ink:#58435a;--mute:#8f7a90;--line:#e0dcef;--pink:#f6e7ec;--accent:#b8607f;--accent-ink:#8f3f60;--ok:#2f9d73;--okbg:#e3f6ec;--bad:#d6455d;--badbg:#ffe3e8;--cl:#7378b4;--clbg:#e7e5f1;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,summary,.ct{touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
button:focus:not(:focus-visible),summary:focus:not(:focus-visible){outline:none}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.65 var(--font);background:radial-gradient(circle at 12% 0%,var(--bg2) 0,transparent 42%),radial-gradient(circle at 100% 30%,#f6e7ec 0,transparent 38%),var(--bg)}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:18px 16px 56px}
.hero{display:flex;align-items:center;gap:12px;margin:4px 0 18px}
.hero .cat{width:64px;height:64px;flex:none}
.hero>div{min-width:0}
.hero h1{font-size:24px;line-height:1.25;margin:0;white-space:nowrap;letter-spacing:.04em;background:linear-gradient(90deg,#b8607f,#7378b4);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.hero p{margin:2px 0 0;color:var(--mute);font-size:13px;white-space:nowrap}
.hero .ghost{width:60px;height:60px;margin-left:auto;flex:none;animation:float 3.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
section{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:16px;box-shadow:0 6px 18px rgba(196,199,230,.16)}
section::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#f3bfd0,#d9d4f2,#f3bfd0)}
.spk{position:absolute;left:var(--x);top:var(--y);color:#e9b7c8;font-size:var(--f);opacity:.7;animation:twinkle var(--d) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:.9;transform:scale(1.15)}}
.foot{text-align:center;color:var(--mute);font-size:13px;margin:20px 0 0;letter-spacing:.08em}
h2{display:flex;align-items:center;gap:6px;font-size:17px;margin:0 0 10px;color:var(--ink)}
h2 svg{width:20px;height:20px;flex:none}
input{font:inherit;font-size:15px;color:var(--ink);background:#fbf6f9;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input::placeholder{color:#c0aebb}
button{font:inherit;font-size:14px;border:1.5px solid var(--line);background:#fff;color:var(--accent);border-radius:12px;padding:8px 14px;cursor:pointer}
button.p{background:#f6e7ec;color:#8f3f60;border-color:#e3b3c4;font-weight:700}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus{outline:none;border-color:var(--accent)}
input:not(:focus){border-color:var(--line)}
input:-webkit-autofill,input:-webkit-autofill:focus{-webkit-text-fill-color:var(--ink);-webkit-box-shadow:0 0 0 40px #fbf6f9 inset;transition:background-color 99999s}
button:disabled{opacity:.6;cursor:default}
.row{display:flex;gap:8px;margin-top:10px}
.row input{flex:1;min-width:0}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1.5px dashed var(--line)}
.item:first-of-type{border-top:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item button{flex:none;white-space:nowrap}
.item .t small{color:var(--mute);font-size:12px}
.chip{font-size:13px;padding:3px 11px;border-radius:99px;white-space:nowrap;background:var(--clbg);color:var(--cl)}
.chip.open{background:var(--okbg);color:var(--ok);font-weight:700}
.chip.invalid{background:var(--badbg);color:var(--bad)}
.hint{color:var(--mute);font-size:13px;margin:8px 0 0}
.empty{text-align:center;padding:10px 0 4px;color:var(--mute)}
.empty .mini{width:72px;height:72px}
.empty p{margin:4px 0 0;font-size:14px}
#msg{position:sticky;top:8px;z-index:5;padding:10px 14px;border-radius:14px;margin-bottom:12px;display:none;font-size:14px;box-shadow:0 4px 14px rgba(196,199,230,.25)}
#msg.ok{display:block;background:var(--okbg);color:var(--ok)}
#msg.err{display:block;background:var(--badbg);color:var(--bad)}
label{font-size:13px;color:var(--mute);display:block;margin:10px 0 4px}
details summary{cursor:pointer;font-weight:700;color:var(--accent)}
.petals{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.petals i{position:absolute;top:-30px;left:var(--x);width:var(--s);height:var(--s);background:#efc9d6;border-radius:150% 0 150% 0;opacity:.7;animation:fall var(--d) linear var(--delay) infinite}
@keyframes fall{0%{transform:translate3d(0,-30px,0) rotate(0)}100%{transform:translate3d(60px,110vh,0) rotate(400deg)}}
@media (prefers-reduced-motion:reduce){.petals,.spk{display:none}.hero .ghost{animation:none}}
#alert{position:sticky;top:8px;z-index:6;display:none;padding:12px 14px;border-radius:14px;margin-bottom:12px;background:#fff3c9;color:#7a5a00;font-size:14px;box-shadow:0 4px 14px rgba(196,199,230,.25)}
#alert.on{display:block}
#alert button{margin-left:8px;padding:2px 10px;font-size:12px}
.delta.up{color:var(--ok);font-weight:700}
.row2{display:flex;gap:8px;margin-top:10px;align-items:center}
.row2 input{width:72px;flex:none;padding:6px 8px}
.row2 span{font-size:13px;color:var(--mute)}
.chip.unsure{background:#fff3c9;color:#8a6a00}
.comm{padding:12px 0;border-top:1.5px dashed var(--line)}
.comm:first-child{border-top:0;padding-top:2px}
.comm .top{display:flex;align-items:flex-start;gap:10px}
.comm .top b{flex:1;min-width:0;word-break:break-word;line-height:1.45}
.comm .top .chip{flex:none;margin-top:1px}
.comm small{display:block;color:var(--mute);font-size:12px;margin-top:2px;word-break:break-all}
.acts{display:flex;gap:8px;margin-top:8px}
.acts button{padding:4px 12px;font-size:13px;border-radius:10px}

textarea{font:inherit;font-size:15px;color:var(--ink);background:#fbf6f9;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:84px;resize:vertical;display:block}
textarea::placeholder{color:#c0aebb}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.clip{padding:12px 0;border-top:1.5px dashed var(--line)}
.clip:first-child{border-top:0;padding-top:2px}
.clip .ct{white-space:pre-wrap;word-break:break-word;line-height:1.5;font-size:15px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.clip .ct.open{display:block;-webkit-line-clamp:unset}
.clip .ft{display:flex;align-items:center;gap:8px;margin-top:8px}
.clip .ft small{flex:1;min-width:0;color:var(--mute);font-size:12px}
.clip .ft button{flex:none;min-width:64px;height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.clip .ft button.p{min-width:88px}
.cliprow{display:flex;gap:8px;margin-top:10px}
.cliprow button{flex:1;height:42px;padding:0 12px}
.h2row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px}
.h2row h2{margin:0}
.h2row button{flex:none;padding:3px 12px;font-size:13px;border-radius:10px}
</style>
</head>

<main>
<header class="hero">
  <svg class="cat" viewBox="0 0 64 64" role="img" aria-label="小猫"><use href="#cat"/></svg>
  <div>
    <h1>社区开门监控</h1>
    <p>小猫守着门，开了就叫你</p>
  </div>
  <svg class="ghost" viewBox="0 0 64 64" role="img" aria-label="小幽灵"><use href="#ghost"/></svg>
</header>
<div id="msg" role="status"></div>
<div id="alert" role="alert"></div>

<section>
  <details id="setup">
    <summary>连接设置</summary>
    <label for="repo">GitHub 仓库（格式：用户名/仓库名）</label>
    <input id="repo" name="gh-repo" placeholder="yourname/discord-monitor" autocapitalize="none" autocomplete="off" spellcheck="false">
    <label for="token">访问令牌（只保存在这台设备的浏览器里）</label>
    <input id="token" type="password" name="gh-token" placeholder="github_pat_..." autocapitalize="none" autocomplete="new-password" spellcheck="false">
    <div class="row"><button class="p" id="saveCfg">保存设置</button></div>
  </details>
</section>

<section>
  <h2><svg viewBox="-30 -30 60 60" aria-hidden="true"><use href="#sakura" x="-30" y="-30" width="60" height="60"/></svg>监控的社区</h2>
  <div id="comms"><p class="hint">加载中…</p></div>
  <div class="row"><input id="inv" name="invite-link" placeholder="粘贴邀请链接，如 https://discord.gg/xxxx" autocapitalize="none" autocomplete="off" spellcheck="false"><button class="p" id="addC">添加</button></div>
  <p class="hint">人数提醒：网页开着时每 20 秒查一次人数，2 分钟内增加 5 人以上，会在页面顶部提醒。邮件提醒由后台程序负责。</p>
  <p class="hint">状态“不确定”：接口没有报告“暂停邀请”，但这个社区还没出现过关门信号，没法证明它真的开着。见过一次关门后，之后的“开门中”才可信。</p>
  <div class="row"><button id="refresh">刷新状态</button></div>
</section>

<section>
  <h2><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#cat"/></svg>接收提醒的邮箱</h2>
  <div id="mails"></div>
  <div class="row"><input id="mail" type="email" name="notify-mail" placeholder="name@example.com" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" inputmode="email" enterkeyhint="done"><button class="p" id="addM">添加</button></div>
  <p class="hint">邮箱经加密后存到 GitHub 的加密存放处，不会公开。名单只记在这台设备上，换设备需重新输入。</p>
</section>

<section id="clipSec">
  <div class="h2row"><h2><svg viewBox="-30 -30 60 60" aria-hidden="true"><use href="#sakura" x="-30" y="-30" width="60" height="60"/></svg>小剪贴板</h2><button id="clipClear" hidden>清空全部</button></div>
  <textarea id="clipIn" placeholder="输入或粘贴要保存的内容，Ctrl/⌘ + Enter 快速保存" aria-label="剪贴板内容"></textarea>
  <div class="cliprow"><button class="p" id="clipAdd">保存</button></div>
  <div id="clips" style="margin-top:12px"></div>
  <p class="hint">内容只保存在这台设备的浏览器里，不会上传。点内容可以展开全文。</p>
</section>
<p class="foot">✿ 小猫和小幽灵在替你守门 ✿</p>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function msg(t,ok){var m=$("msg");m.textContent=t;m.className=ok?"ok":"err";clearTimeout(msg.t);msg.t=setTimeout(function(){m.className=""},6000)}

var cfg=lsGet("cfg",null)||{repo:"",token:""};
if(!cfg.repo&&/\.github\.io$/.test(location.hostname)){
  var seg=location.pathname.split("/").filter(Boolean)[0];
  if(seg)cfg.repo=location.hostname.split(".")[0]+"/"+seg;
}
$("repo").value=cfg.repo||"";$("token").value=cfg.token||"";
if(!cfg.repo||!cfg.token)$("setup").open=true;
$("saveCfg").onclick=function(){
  cfg={repo:$("repo").value.trim(),token:$("token").value.trim()};
  lsSet("cfg",cfg);msg("设置已保存",true);loadAll();
};

function gh(path,opt){
  opt=opt||{};
  opt.headers=Object.assign({"Authorization":"Bearer "+cfg.token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},opt.headers||{});
  return fetch("https://api.github.com/repos/"+cfg.repo+path,opt);
}
function b64ToStr(b){var bin=atob(b.replace(/\s/g,""));var u=Uint8Array.from(bin,function(c){return c.charCodeAt(0)});return new TextDecoder().decode(u)}
function strToB64(s){var u=new TextEncoder().encode(s),bin="";u.forEach(function(c){bin+=String.fromCharCode(c)});return btoa(bin)}
async function getFile(name){
  var r=await gh("/contents/"+name+"?t="+Date.now());
  if(r.status===404)return null;
  if(!r.ok)throw new Error("读取 "+name+" 失败（"+r.status+"），请检查仓库名和令牌权限");
  var j=await r.json();
  return {data:JSON.parse(b64ToStr(j.content)),sha:j.sha};
}
async function putFile(name,obj,sha,note){
  var body={message:note,content:strToB64(JSON.stringify(obj,null,2)+"\n")};
  if(sha)body.sha=sha;
  var r=await gh("/contents/"+name,{method:"PUT",body:JSON.stringify(body)});
  if(!r.ok)throw new Error("保存失败（"+r.status+"），令牌需要有仓库内容的读写权限");
}

function codeOf(s){
  s=s.trim();
  var m=s.match(/(?:discord\.gg|discord\.com\/invite|discordapp\.com\/invite)\/([A-Za-z0-9-_]+)/i);
  if(m)return m[1];
  return /^[A-Za-z0-9-_]+$/.test(s)?s:null;
}
async function live(code){
  var ac=window.AbortController?new AbortController():null,tm=setTimeout(function(){if(ac)ac.abort()},8000);
  try{
    var r=await fetch("https://discord.com/api/v10/invites/"+encodeURIComponent(code)+"?with_counts=true",ac?{signal:ac.signal}:{});
    if(r.status===404)return {status:"invalid"};
    if(!r.ok)return null;
    var j=await r.json();
    var f=(j.guild&&j.guild.features)||[];
    return {status:f.indexOf("INVITES_DISABLED")>=0?"closed":"open",name:j.guild&&j.guild.name,count:typeof j.approximate_member_count==="number"?j.approximate_member_count:null};
  }catch(e){return null}finally{clearTimeout(tm)}
}

var comms=[],states={},liveSt={},hist={},lastAlert={};
var LABEL={open:"开门中",closed:"关门",invalid:"链接失效",unsure:"不确定"};
var seen=lsGet("seenClosed",{});
function markSeen(code){if(!seen[code]){seen[code]=1;lsSet("seenClosed",seen)}}
function showSt(code){
  var st=liveSt[code]||states[code];
  if(liveSt[code]==="closed"||states[code]==="closed")markSeen(code);
  if(st==="open"&&!seen[code])return "unsure";
  return st;
}
function renderComms(){
  var el=$("comms");
  if(!comms.length){el.innerHTML='<div class="empty"><svg class="mini" viewBox="0 0 64 64" aria-hidden="true"><use href="#cat"/></svg><p>还没有社区，粘贴邀请链接让小猫帮你守门。</p></div>';return}
  el.innerHTML=comms.map(function(c,i){
    var code=codeOf(c.invite)||"";
    var st=showSt(code);
    var chip=st?'<span class="chip '+st+'">'+LABEL[st]+'</span>':'<span class="chip">等待检查</span>';
    return '<div class="comm"><div class="top"><b>'+esc(c.name||code)+'</b>'+chip+'</div><small>'+esc(code)+countText(code)+'</small><div class="acts"><button data-c="'+i+'" aria-label="复制链接">复制链接</button><button data-r="'+i+'" aria-label="改名">改名</button><button data-i="'+i+'" aria-label="删除">删除</button></div></div>';
  }).join("");
}
async function loadAll(){
  if(!cfg.repo||!cfg.token){$("comms").innerHTML='<p class="hint">先在上方“连接设置”填好仓库和令牌。</p>';return}
  try{
    var f=await getFile("communities.json");comms=f?f.data:[];
    var s=await getFile("state.json");states=s?s.data:{};
    liveSt={};renderComms();
    return await pollLive(true);
  }catch(e){msg(e.message,false)}
}
$("refresh").onclick=async function(){
  var b=$("refresh");
  if(b.disabled)return;
  if(!cfg.repo||!cfg.token){msg("请先在“连接设置”里填好仓库和令牌",false);$("setup").open=true;return}
  b.disabled=true;b.textContent="刷新中…";
  try{
    var n=await loadAll();
    if(n!==undefined)msg(n.total?("已刷新，"+n.ok+"/"+n.total+" 个社区查询成功"+(n.ok<n.total?"（其余网络超时，稍后再试）":"")):"已刷新",n.total===0||n.ok>0);
  }finally{b.disabled=false;b.textContent="刷新状态"}
};

$("addC").onclick=async function(){
  $("inv").blur();
  var code=codeOf($("inv").value);
  if(!code){msg("看不懂这个链接，请粘贴 discord.gg/… 形式的邀请链接",false);return}
  if(!cfg.repo||!cfg.token){msg("请先填写连接设置",false);return}
  try{
    var f=await getFile("communities.json");
    var list=f?f.data:[];
    if(list.some(function(x){return codeOf(x.invite)===code})){msg("这个社区已经在名单里了",false);return}
    var r=await live(code);
    var name=(r&&r.name)||code;
    list.push({name:name,invite:"https://discord.gg/"+code});
    await putFile("communities.json",list,f&&f.sha,"add "+code);
    $("inv").value="";comms=list;if(r)liveSt[code]=r.status;renderComms();
    msg(r?("已添加「"+name+"」，当前："+LABEL[showSt(code)]):"已添加，稍后自动检查并显示状态",true);
  }catch(e){msg(e.message,false)}
};
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t);
  return new Promise(function(res,rej){
    var a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";
    document.body.appendChild(a);a.select();
    try{document.execCommand("copy")?res():rej()}catch(e){rej(e)}
    document.body.removeChild(a);
  });
}
$("comms").addEventListener("click",function(e){
  var c=e.target.getAttribute&&e.target.getAttribute("data-c");
  if(c==null)return;
  var link="https://discord.gg/"+codeOf(comms[+c].invite);
  copyText(link).then(function(){
    msg("已复制："+link,true);
    var b=e.target,old=b.textContent;b.textContent="已复制 ✓";setTimeout(function(){b.textContent=old},1500);
  },function(){msg("复制失败，请长按手动复制："+link,false)});
});
$("comms").addEventListener("click",async function(e){
  var i=e.target.getAttribute&&e.target.getAttribute("data-i");
  if(i==null)return;
  try{
    var f=await getFile("communities.json");var list=f?f.data:[];
    var code=codeOf(comms[+i].invite);
    list=list.filter(function(x){return codeOf(x.invite)!==code});
    await putFile("communities.json",list,f&&f.sha,"remove "+code);
    comms=list;renderComms();msg("已删除",true);
  }catch(err){msg(err.message,false)}
});

async function renameComm(i){
  var c=comms[i];if(!c)return;
  var code=codeOf(c.invite)||"";
  var v=prompt("新的显示名称（留空则恢复为邀请码）",c.name||code);
  if(v===null)return;
  v=v.trim();
  try{
    var f=await getFile("communities.json");var list=f?f.data:[];
    var hit=false;
    list.forEach(function(x){if(codeOf(x.invite)===code){x.name=v||code;hit=true}});
    if(!hit){msg("没找到这个社区，请先刷新",false);return}
    await putFile("communities.json",list,f&&f.sha,"rename "+code);
    comms=list;renderComms();msg("已改名为「"+(v||code)+"」，邮件里也会用这个名字",true);
  }catch(err){msg(err.message,false)}
}
$("comms").addEventListener("click",function(e){
  var r=e.target.getAttribute&&e.target.getAttribute("data-r");
  if(r==null)return;
  renameComm(+r);
});

var mails=lsGet("mails",[]);
function renderMails(){
  $("mails").innerHTML=mails.length?mails.map(function(m,i){
    return '<div class="item"><div class="t"><b>'+esc(m)+'</b></div><button data-m="'+i+'">删除</button></div>';
  }).join(""):'<p class="hint">还没有邮箱。</p>';
}
var SODIUM_URLS=[
  "https://cdn.jsdelivr.net/npm/libsodium-wrappers@0.7.13/dist/browsers/sodium.js",
  "https://gcore.jsdelivr.net/npm/libsodium-wrappers@0.7.13/dist/browsers/sodium.js",
  "https://fastly.jsdelivr.net/npm/libsodium-wrappers@0.7.13/dist/browsers/sodium.js",
  "https://unpkg.com/libsodium-wrappers@0.7.13/dist/browsers/sodium.js"
];
function loadScript(u){
  return new Promise(function(res,rej){
    var s=document.createElement("script"),done=false;
    function fin(ok){if(done)return;done=true;clearTimeout(t);ok?res():(s.remove(),rej())}
    var t=setTimeout(function(){fin(false)},12000);
    s.src=u;s.onload=function(){fin(!!window.sodium)};s.onerror=function(){fin(false)};
    document.head.appendChild(s);
  });
}
async function ensureSodium(){
  if(window.sodium)return;
  for(var i=0;i<SODIUM_URLS.length;i++){
    try{await loadScript(SODIUM_URLS[i]);return}catch(e){}
  }
  throw new Error("加密组件加载失败（已试了多条线路），请换个网络（如 Wi-Fi/流量切换）后再试");
}
async function saveSecret(){
  await ensureSodium();
  if(!mails.length){throw new Error("名单是空的，没有写入。请至少保留一个邮箱")}
  await sodium.ready;
  var kr=await gh("/actions/secrets/public-key");
  if(!kr.ok)throw new Error("获取加密公钥失败（"+kr.status+"），令牌需要“Secrets”读写权限");
  var k=await kr.json();
  var enc=sodium.crypto_box_seal(sodium.from_string(mails.join(",")),sodium.from_base64(k.key,sodium.base64_variants.ORIGINAL));
  var val=sodium.to_base64(enc,sodium.base64_variants.ORIGINAL);
  var r=await gh("/actions/secrets/MAIL_TO",{method:"PUT",body:JSON.stringify({encrypted_value:val,key_id:k.key_id})});
  if(!r.ok)throw new Error("写入邮箱失败（"+r.status+"）");
}
async function mailChanged(okText){
  lsSet("mails",mails);renderMails();
  if(!cfg.repo||!cfg.token){msg("请先填写连接设置",false);return}
  try{await saveSecret();msg(okText,true)}catch(e){msg(e.message,false)}
}
$("addM").onclick=function(){
  var v=$("mail").value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){msg("邮箱格式不对",false);return}
  if(mails.indexOf(v)>=0){msg("这个邮箱已经在名单里了",false);return}
  mails.push(v);$("mail").value="";$("mail").blur();mailChanged("邮箱已加密保存到 GitHub");
};
$("mail").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();$("addM").click()}});
$("inv").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();$("addC").click()}});
$("mails").addEventListener("click",function(e){
  var i=e.target.getAttribute&&e.target.getAttribute("data-m");
  if(i==null)return;
  mails.splice(+i,1);mailChanged("名单已更新");
});

function countText(code){
  var h=hist[code];if(!h||!h.length)return "";
  var n=h[h.length-1].n,low=Math.min.apply(null,h.map(function(x){return x.n})),d=n-low;
  return " · 约"+n+"人"+(d>0?' <span class="delta up">+'+d+'</span>':"");
}
function gw(){return {n:5,ms:120000}}
function showAlert(hits){
  var a=$("alert");
  a.innerHTML="人数激增："+esc(hits.join("；"))+'<button id="alertX">知道了</button>';
  a.className="on";
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
  $("alertX").onclick=function(){a.className=""};
}
var polling=false;
var pollStart=0;
async function pollLive(force){
  if(polling&&!(force&&Date.now()-pollStart>15000))return;
  polling=true;pollStart=Date.now();
  var okN=0;
  try{
    var g=gw(),now=Date.now(),hits=[];
    await Promise.all(comms.map(async function(c){
      var code=codeOf(c.invite);if(!code)return;
      var r=await live(code);if(!r)return;
      okN++;liveSt[code]=r.status;
      if(typeof r.count==="number"){
        var h=hist[code]=hist[code]||[];
        h.push({t:now,n:r.count});
        while(h.length&&now-h[0].t>g.ms)h.shift();
        var low=Math.min.apply(null,h.map(function(x){return x.n}));
        if(r.count-low>=g.n&&now-(lastAlert[code]||0)>600000){
          lastAlert[code]=now;
          hits.push((c.name||code)+" +"+(r.count-low)+"（"+low+"→"+r.count+"）");
        }
      }
    }));
    renderComms();
    if(hits.length)showAlert(hits);
    return {ok:okN,total:comms.length};
  }finally{polling=false}
}
setInterval(function(){if(!document.hidden&&cfg.repo&&cfg.token&&comms.length)pollLive()},20000);

renderMails();loadAll();
})();
</script>
<script>
(function(){
var K="clips",MAX=100;
function g(i){return document.getElementById(i)}
function load(){try{var v=JSON.parse(localStorage.getItem(K));return Array.isArray(v)?v:[]}catch(e){return []}}
function save(){try{localStorage.setItem(K,JSON.stringify(clips))}catch(e){toast("保存失败：浏览器存储不可用",false)}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(t,ok){var m=g("msg");if(!m)return;m.textContent=t;m.className=ok?"ok":"err";clearTimeout(toast.t);toast.t=setTimeout(function(){m.className=""},3000)}
function copy(t){
  function legacy(){
    return new Promise(function(res,rej){
      var a=document.createElement("textarea");a.value=t;a.readOnly=true;
      a.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:0;font-size:16px";
      document.body.appendChild(a);a.focus();a.select();
      try{a.setSelectionRange(0,t.length)}catch(x){}
      var ok=false;try{ok=document.execCommand("copy")}catch(x){}
      document.body.removeChild(a);
      ok?res():rej();
    });
  }
  if(navigator.clipboard&&window.isSecureContext){
    return navigator.clipboard.writeText(t).catch(legacy);
  }
  return legacy();
}
function selectText(el){
  try{var r=document.createRange();r.selectNodeContents(el);var s=window.getSelection();s.removeAllRanges();s.addRange(r)}catch(x){}
}
function when(ts){var d=new Date(ts),p=function(n){return n<10?"0"+n:n};return (d.getMonth()+1)+"/"+d.getDate()+" "+p(d.getHours())+":"+p(d.getMinutes())}
var clips=load();
function render(){
  var el=g("clips");
  g("clipClear").hidden=!clips.length;
  if(!clips.length){el.innerHTML='<p class="hint" style="text-align:center">还没有内容，写点什么保存下来吧。</p>';return}
  el.innerHTML=clips.map(function(c,i){
    return '<div class="clip"><div class="ct" data-t="'+i+'">'+esc(c.t)+'</div><div class="ft"><small>'+when(c.at)+'</small><button data-d="'+i+'" aria-label="删除">删除</button><button class="p" data-c="'+i+'" aria-label="复制">复制</button></div></div>';
  }).join("");
}
function add(){
  var v=g("clipIn").value;
  if(!v.trim()){toast("先输入点内容",false);return}
  clips.unshift({t:v,at:Date.now()});
  if(clips.length>MAX)clips.length=MAX;
  save();g("clipIn").value="";render();toast("已保存",true);
}
g("clipAdd").onclick=add;
g("clipIn").addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();add()}});
g("clips").addEventListener("click",function(e){
  var t=e.target,i;
  if(t.getAttribute&&t.getAttribute("data-t")!=null){t.classList.toggle("open");return}
  if(t.getAttribute&&(i=t.getAttribute("data-c"))!=null){
    copy(clips[+i].t).then(function(){
      var old=t.textContent;t.textContent="已复制 ✓";setTimeout(function(){t.textContent=old},1500);toast("已复制",true);
    },function(){
      var box=t.closest(".clip").querySelector(".ct");box.classList.add("open");selectText(box);
      toast("这里不允许自动复制，内容已选中，请点弹出的“复制”",false);
    });
    return;
  }
  if(t.getAttribute&&(i=t.getAttribute("data-d"))!=null){clips.splice(+i,1);save();render();toast("已删除",true)}
});
g("clipClear").onclick=function(){
  var b=g("clipClear");
  if(b.getAttribute("data-arm")!=="1"){
    b.setAttribute("data-arm","1");b.textContent="再点一次确认清空";b.className="p";
    clearTimeout(b.t);b.t=setTimeout(function(){b.removeAttribute("data-arm");b.textContent="清空全部";b.className=""},3000);
    return;
  }
  clearTimeout(b.t);b.removeAttribute("data-arm");b.textContent="清空全部";b.className="";
  clips=[];save();render();toast("已清空",true);
};
render();
})();
</script>
</body>
